name: contribution snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#2453d4&color_dots=#ebedf0,#c6d4f7,#8aa6ee,#4f79e2,#2453d4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f5b818&color_dots=#161b22,#16255c,#1e3aa0,#2453d4,#6f93ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
